<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bun on Vercel</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      body {
        max-width: 42rem;
        margin: 4rem auto;
        padding: 0 1.5rem;
      }
      h1 {
        letter-spacing: -0.04em;
      }
      ul {
        padding: 0;
        list-style: none;
      }
      a {
        display: block;
        margin: 0.75rem 0;
        padding: 1rem;
        border: 1px solid color-mix(in srgb, currentColor 25%, transparent);
        border-radius: 0.5rem;
        color: inherit;
        text-decoration: none;
      }
      a:hover {
        border-color: currentColor;
      }
      code {
        opacity: 0.7;
      }
    </style>
  </head>
  <body>
    <h1>Bun on Vercel</h1>
    <p>This example uses <code>Bun.serve()</code> route handlers.</p>
    <nav aria-label="Example routes">
      <ul>
        <li>
          <a href="/"><strong>Home</strong><br /><code>GET /</code></a>
        </li>
        <li>
          <a href="/api/hello"
            ><strong>Hello API</strong><br /><code>GET /api/hello</code></a
          >
        </li>
      </ul>
    </nav>
  </body>
</html>
