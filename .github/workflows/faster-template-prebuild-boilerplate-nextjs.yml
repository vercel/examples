name: Prebuild Next.js Boilerplate Example

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:

jobs:
  clone-build-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOKEN_PULL_REQUESTS }}

      - uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      - run: |
          node --version
          npm --version
          corepack enable pnpm

      - run: |
          npm install -g vercel@latest
          vc --version

      - working-directory: ./framework-boilerplates/nextjs
        run: |
          pnpm install --frozen-lockfile
        env:
          NPM_CONFIG_LOGLEVEL: http

      - name: Authenticate Vercel CLI
        uses: vercel/authenticate-cli-action@34fa13671fee771a9f656d6dda34148f8dce0c8d
        with:
          team: ${{ vars.VERCEL_ORG_ID }}

      - working-directory: ./framework-boilerplates/nextjs
        run: |
          vc build --debug --yes --prod
        env:
          VERCEL_PROJECT_ID: prj_D1Kp06w4jE67wyV3WlMHjtfDLjhC

      - working-directory: ./framework-boilerplates/nextjs
        run: |
          vc deploy --debug --yes --prod --prebuilt --archive=tgz
        env:
          VERCEL_PROJECT_ID: prj_D1Kp06w4jE67wyV3WlMHjtfDLjhC
